<!doctype html>
<html><head><meta charset="utf-8"><title>Wake Me Up</title>
<style>html,body{margin:0;background:#000}canvas{display:block}</style></head>
<body><canvas id="c" width="960" height="720"></canvas>
<script>
// Kinetic-type music video in the "how do you communicate a change?" format.
// Timed to "Wake Me Up" (Avicii), ~124 BPM. render(t) draws one frame at time t (seconds).
const W = 960, H = 720, BPM = 124, B = 60 / BPM, DURATION = 20.5;
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const RED = '#e3241b', INK = '#1a1410', PAPER = '#e7e4df', DARK = '#131112';
const PI = Math.PI, TAU = PI * 2;

// ---------- helpers ----------
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const lerp = (a, b, p) => a + (b - a) * p;
const seg = (x, a, b) => clamp((x - a) / (b - a));
const eOut = p => 1 - Math.pow(1 - p, 3);
const eInOut = p => p < .5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2;
const eBack = p => { const c = 1.9; return 1 + (c + 1) * Math.pow(p - 1, 3) + c * Math.pow(p - 1, 2); };
function rng(seed) { let a = seed >>> 0; return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function mk(w = W, h = H) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }
function reset(g) { g.setTransform(1, 0, 0, 1, 0, 0); g.globalAlpha = 1; g.globalCompositeOperation = 'source-over'; g.filter = 'none'; g.shadowBlur = 0; }

// ---------- pixel-art sprites (16x16) ----------
const PAL = { k: '#161314', r: '#e3241b', R: '#9e1712', p: '#ff9a8a', w: '#f4f1ea', g: '#a7a4a0', G: '#5c5a58', y: '#f7c51e', Y: '#c48a0a', o: '#f08a24', O: '#b35a12', b: '#8b5a2b', B: '#5a3618', n: '#5fb548', N: '#2f7a2c', u: '#3d6fd8', U: '#23408a', s: '#9ad0ff', m: '#b8282a' };
const SPR = {
  heart: ['................', '..kkk.....kkk...', '.krrrk...krrrk..', 'krpprrk.krrrrrk.', 'krpwrrrkrrrrrrk.', 'krprrrrrrrrrrrk.', 'krrrrrrrrrrrrrk.', 'krrrrrrrrrrrrRk.', '.krrrrrrrrrrRk..', '..krrrrrrrrRk...', '...krrrrrrRk....', '....krrrrRk.....', '.....krrRk......', '......kRk.......', '.......k........'],
  clock: ['.kkk......kkk...', 'kyyyk....kyyyk..', 'kyyk.kkkk.kyyk..', '.kkkkrrrrkkkk...', '..krrwwwwrrk....', '.krwwwwkwwwrk...', '.krwwwwkwwwrk...', 'krwkwwwkwwkwrk..', 'krwwwwwkkkwwrk..', 'krwwwwwwwwwwrk..', '.krwwwwwwwwrk...', '.krRwwwkwwRrk...', '..krRRwwRRrk....', '...kkkkkkkkk....', '..kk.......kk...'],
  sun: ['.......y........', '..y....y....y...', '...y...y...y....', '.....kkkkk......', '....kyyyyyk.....', '...kyywyyyyk....', 'yy.kywyyyyyk.yy.', '...kyyyyyyYk....', '...kyyyyyYYk....', '....kyyyYYk.....', '.....kkkkk......', '...y...y...y....', '..y....y....y...', '.......y........'],
  guitar: ['.........kkk....', '........kGGGk...', '.........kGk....', '.........kbk....', '.........kbk....', '.........kbk....', '.........kbk....', '......kkkkbkkk..', '.....koooobooOk.', '......kookkoOk..', '.....kooookoooOk', '....koooOkkkooOk', '....kooooooooOOk', '....kOoooobbooOk', '.....kOOOOOOOOk.', '......kkkkkkkk..'],
  book: ['................', '..kkkkkkkkkkk...', '..kmmmmmmmmmmk..', '..kmmnnnnnnmmk..', '..kmmnNNNNnmmk..', '..kmmnnnnnnmmk..', '..kmmmmmmmmmmk..', '..kmmmmmmmmmmk..', '..kmmmmmmmmmmk..', '..kmmmmmmmmmmk..', '..kRmmmmmmmmmk..', '..kRmmmmmmmmmk..', '..kRwwwwwwwwwwk.', '..kRkkkkkkkkkkk.', '..kkk...........'],
  boot: ['................', '...kkkkkkk......', '...kbbbbbk......', '...kBkkkBk......', '...kbbbbbk......', '...kBkkkBk......', '...kbbbbbk......', '...kbbbbbkkk....', '...kbbbbbbbbkk..', '...kbbbbbbbbbbk.', '...kbbbbbbbbbbk.', '...kBBBBBBBBBBk.', '...kkkkkkkkkkkk.'],
  compass: ['.......kk.......', '......kyyk......', '....kkkkkkkk....', '...kYwwwwwwYk...', '..kYwwwrwwwwYk..', '..kwwwwrrwwwwk..', '.kYwwwwrrwwwwYk.', '.kwwwwwrrwwwwwk.', '.kwwwwwggwwwwwk.', '.kYwwwwggwwwwYk.', '..kwwwwggwwwwk..', '..kYwwwgwwwwYk..', '...kYwwwwwwYk...', '....kkkkkkkk....'],
  mountain: ['................', '.......k........', '......kwk.......', '.....kwwwk......', '....kwgwggk.....', '...kgggGgggk.k..', '...kggGGGggkkwk.', '..kgGGGGGGGgkgwk', '.kgGGGGGGGGGkggk', '.kGGGGGGGGGGGGGk', 'kkkkkkkkkkkkkkkk'],
  moon: ['.....kkkk.......', '...kkyyyk.......', '..kyyyyk........', '.kyyyyk.........', '.kyyyk..........', 'kyyyyk..........', 'kyyyyk.......y..', 'kyyyyk..........', 'kyyyyyk.........', '.kyyyyyk......k.', '.kyyyyyykkkkkyk.', '..kyyyyyyyyyyk..', '...kkyyyyyykk...', '.....kkkkkk.....'],
  camera: ['................', '....kkkk........', '.kkkGGGGkkkkkkk.', 'kgggggggggggrgk.', 'kGGGGkkkkkGGGGk.', 'kGGGkwwwwwkGGGk.', 'kGGkwkkkkkwkGGk.', 'kgggkwkUUkwkggk.', 'kgggkwkUskwkggk.', 'kgggkwkkkkwkggk.', 'kGGGkwwwwwkGGGk.', 'kGGGGkkkkkGGGGk.', 'kkkkkkkkkkkkkkk.'],
  plant: ['.....n...n......', '....nNn.nNn.....', '...nNnnnnNnn....', '..nNn.nNn.nNn...', '...n.nNNNn.n....', '.....nNnNn......', '......nNn.......', '....kkkkkkk.....', '....kuuuuuk.....', '....kUuuuuk.....', '.....kuuuk......', '.....kUuuk......', '.....kkkkk......'],
  backpack: ['.....kkkk.......', '....k....k......', '...kkkkkkkk.....', '..koooooooook...', '..kooooooooook..', '..koOOOOOOOook..', '..kokkkkkkkook..', '..kooooooooook..', '..kokkkkkkkook..', '..koOooooooOok..', '..koOooooooOok..', '..kooooooooook..', '..kkkkkkkkkkkk..'],
  note: ['.......kkkkk....', '.......krrrrk...', '.......kkkkrk...', '.......k...rk...', '.......k...rk...', '.......k...rk...', '....kkkk.kkrk...', '...krrrk.krrk...', '...krrrk.krrk...', '....kkk..kkk....'],
};
const SPRC = {};
function buildSprites() {
  for (const [name, rows0] of Object.entries(SPR)) {
    const rows = rows0.map(r => r.padEnd(16, '.').slice(0, 16));
    const top = Math.floor((16 - rows.length) / 2);
    const make = (fn) => { const c = mk(16, 16), g = c.getContext('2d'); rows.forEach((r, y) => [...r].forEach((ch, x) => { if (ch !== '.') { g.fillStyle = fn(PAL[ch]); g.fillRect(x, y + top, 1, 1); } })); return c; };
    SPRC[name] = { n: make(c => c), d: make(() => '#2a2222'), k: make(() => '#0c0b0b') };
  }
}
// Draw a sprite with a little extruded depth (the slightly-3D pixel look)
function spr(g, name, x, y, size, rot = 0, o = {}) {
  const s = SPRC[name]; if (!s) return;
  g.save(); g.translate(x, y); g.rotate(rot); g.imageSmoothingEnabled = false;
  g.globalAlpha = o.alpha ?? 1;
  const d = o.flat ? 0 : Math.max(2, Math.round(size / 16 * 1.3));
  for (let i = d; i > 0; i--) g.drawImage(o.black ? s.k : s.d, -size / 2 + i * .55, -size / 2 + i * .8, size, size);
  g.drawImage(o.black ? s.k : s.n, -size / 2, -size / 2, size, size);
  if (o.blackAmt > 0) { g.globalAlpha = (o.alpha ?? 1) * o.blackAmt; g.drawImage(s.k, -size / 2, -size / 2, size, size); }
  g.restore();
}
// Motion-blurred sprite: ghost copies trailing behind along (vx,vy)
function sprTrail(g, name, x, y, size, rot, vx, vy, n = 6, o = {}) {
  for (let i = n; i > 0; i--) spr(g, name, x - vx * i / n, y - vy * i / n, size, rot, { ...o, alpha: (o.alpha ?? 1) * .18 * (1 - i / (n + 1)), flat: true });
  spr(g, name, x, y, size, rot, o);
}

// ---------- textures ----------
let PAPER_TEX, DARK_TEX, GRAIN = [];
function buildTextures() {
  const R = rng(7);
  PAPER_TEX = mk(); let g = PAPER_TEX.getContext('2d');
  g.fillStyle = PAPER; g.fillRect(0, 0, W, H);
  g.filter = 'blur(30px)';
  for (let i = 0; i < 160; i++) { g.fillStyle = R() < .5 ? 'rgba(120,110,100,0.022)' : 'rgba(255,255,255,0.04)'; g.beginPath(); g.arc(R() * W, R() * H, 20 + R() * 120, 0, TAU); g.fill(); }
  g.filter = 'none';
  for (let i = 0; i < 500; i++) { g.strokeStyle = `rgba(90,80,70,${.03 + R() * .04})`; g.lineWidth = .7; g.beginPath(); const x = R() * W, y = R() * H, a = R() * TAU, l = 4 + R() * 14; g.moveTo(x, y); g.lineTo(x + Math.cos(a) * l, y + Math.sin(a) * l); g.stroke(); }
  for (let i = 0; i < 90; i++) { g.fillStyle = `rgba(40,30,30,${.15 + R() * .3})`; g.fillRect(R() * W, R() * H, 1 + R() * 1.5, 1 + R() * 1.5); }
  DARK_TEX = mk(); g = DARK_TEX.getContext('2d');
  const rg = g.createRadialGradient(W / 2, H / 2, 50, W / 2, H / 2, 650); rg.addColorStop(0, '#1f1c1d'); rg.addColorStop(1, '#0b0a0a');
  g.fillStyle = rg; g.fillRect(0, 0, W, H);
  for (let i = 0; i < 160; i++) { g.fillStyle = `rgba(255,255,255,${.04 + R() * .12})`; g.fillRect(R() * W, R() * H, 1 + R() * 1.4, 1 + R() * 1.4); }
  for (let k = 0; k < 4; k++) {
    const c = mk(W / 2, H / 2), cg = c.getContext('2d'), id = cg.createImageData(W / 2, H / 2), Rn = rng(100 + k);
    for (let i = 0; i < id.data.length; i += 4) { const v = Rn() * 255; id.data[i] = id.data[i + 1] = id.data[i + 2] = v; id.data[i + 3] = 26; }
    cg.putImageData(id, 0, 0); GRAIN.push(c);
  }
}
function paper(g) { reset(g); g.drawImage(PAPER_TEX, 0, 0); }
function dark(g) { reset(g); g.drawImage(DARK_TEX, 0, 0); }
function vignette(g, amt, cx = W / 2, cy = H / 2, inner = 200, color = '0,0,0') {
  const rg = g.createRadialGradient(cx, cy, inner, cx, cy, 720);
  rg.addColorStop(0, `rgba(${color},0)`); rg.addColorStop(1, `rgba(${color},${amt})`);
  g.fillStyle = rg; g.fillRect(0, 0, W, H);
}

// ---------- drawing primitives ----------
function scribble(g, cx, cy, rx, ry, p, seed, color, lw = 2, turns = 1.25, rot = 0) {
  if (p <= 0) return; const R = rng(seed), ph = [R() * 6, R() * 6], a0 = R() * TAU, N = 120;
  g.save(); g.strokeStyle = color; g.lineWidth = lw; g.lineCap = 'round'; g.lineJoin = 'round'; g.beginPath();
  for (let i = 0; i <= N; i++) {
    const a = a0 + turns * TAU * p * i / N, k = 1 + .09 * Math.sin(a * 2.3 + ph[0]) + .05 * Math.sin(a * 5.1 + ph[1]) + .07 * (a - a0) / TAU;
    const x = Math.cos(a) * rx * k, y = Math.sin(a) * ry * k;
    const X = cx + x * Math.cos(rot) - y * Math.sin(rot), Y = cy + x * Math.sin(rot) + y * Math.cos(rot);
    i ? g.lineTo(X, Y) : g.moveTo(X, Y);
  }
  g.stroke(); g.restore();
}
// smooth pen line through control points, drawn up to fraction p (from p0)
function pen(g, pts, p, color, lw = 2, p0 = 0) {
  if (p <= p0) return; const dense = [];
  for (let i = 0; i < pts.length - 1; i++) {
    const a = pts[Math.max(0, i - 1)], b = pts[i], c = pts[i + 1], d = pts[Math.min(pts.length - 1, i + 2)];
    for (let t = 0; t < 1; t += .05) { const t2 = t * t, t3 = t2 * t; dense.push([.5 * (2 * b[0] + (-a[0] + c[0]) * t + (2 * a[0] - 5 * b[0] + 4 * c[0] - d[0]) * t2 + (-a[0] + 3 * b[0] - 3 * c[0] + d[0]) * t3), .5 * (2 * b[1] + (-a[1] + c[1]) * t + (2 * a[1] - 5 * b[1] + 4 * c[1] - d[1]) * t2 + (-a[1] + 3 * b[1] - 3 * c[1] + d[1]) * t3)]); }
  }
  const i0 = Math.floor(p0 * dense.length), i1 = Math.floor(p * dense.length);
  g.save(); g.strokeStyle = color; g.lineWidth = lw; g.lineCap = 'round'; g.lineJoin = 'round'; g.beginPath();
  for (let i = i0; i < i1; i++) i === i0 ? g.moveTo(...dense[i]) : g.lineTo(...dense[i]);
  g.stroke(); g.restore();
}
function star4(g, x, y, r, rot, sx = 1, sy = 1, inner = .16) {
  g.save(); g.translate(x, y); g.rotate(rot); g.scale(sx, sy); g.beginPath();
  for (let i = 0; i < 4; i++) {
    const a = i * PI / 2, na = a + PI / 2, m = a + PI / 4;
    if (!i) g.moveTo(Math.cos(a) * r, Math.sin(a) * r);
    g.quadraticCurveTo(Math.cos(m) * r * inner, Math.sin(m) * r * inner, Math.cos(na) * r, Math.sin(na) * r);
  }
  g.closePath(); g.restore();
}
function blob(g, x, y, r, seed, rot = 0, stretch = 1, color = '#0d0c0c') {
  const R = rng(seed), ph = [R() * 6, R() * 6, R() * 6];
  g.save(); g.translate(x, y); g.rotate(rot); g.scale(stretch, 1); g.fillStyle = color; g.beginPath();
  for (let i = 0; i <= 40; i++) { const a = i / 40 * TAU, k = 1 + .18 * Math.sin(a * 3 + ph[0]) + .1 * Math.sin(a * 5 + ph[1]) + .06 * Math.sin(a * 9 + ph[2]); i ? g.lineTo(Math.cos(a) * r * k, Math.sin(a) * r * k) : g.moveTo(Math.cos(a) * r * k, Math.sin(a) * r * k); }
  g.fill(); g.restore();
}
// words laid out as a centred sentence; draws first n, returns word boxes
function sentence(g, words, n, cx, y, size, color, weight = 500, align = 'center') {
  g.font = `${weight} ${size}px Inter`; g.textBaseline = 'middle';
  const sp = g.measureText(' ').width, ws = words.map(w => g.measureText(w).width);
  const total = ws.reduce((a, b) => a + b, 0) + sp * (words.length - 1);
  let x = align === 'center' ? cx - total / 2 : align === 'right' ? cx - total : cx; const boxes = [];
  words.forEach((w, i) => {
    boxes.push({ x, w: ws[i], cx: x + ws[i] / 2 });
    if (i < n) { g.fillStyle = typeof color === 'function' ? color(i) : color; g.fillText(w, x, y); }
    x += ws[i] + sp;
  });
  return boxes;
}
function cursor(g, x, y, size, bt, typing, color = '#fff') {
  g.fillStyle = color;
  if (typing) g.fillRect(x, y - size * .45, size * .55, size * .9);
  else if (Math.floor(bt * 2) % 2 === 0) g.fillRect(x, y - size * .5, 3, size);
}

// ---------- thermal-camera silhouettes ----------
const TC = mk();
function smoothShape(c, pts) {
  c.beginPath(); const n = pts.length;
  const mid = i => [(pts[i % n][0] + pts[(i + 1) % n][0]) / 2, (pts[i % n][1] + pts[(i + 1) % n][1]) / 2];
  c.moveTo(...mid(0));
  for (let i = 1; i <= n; i++) c.quadraticCurveTo(pts[i % n][0], pts[i % n][1], ...mid(i));
  c.closePath(); c.fill();
}
const HEAD = [[960, 780], [870, 660], [775, 612], [748, 560], [748, 505], [790, 425], [804, 340], [786, 252], [735, 192], [664, 168], [600, 182], [560, 218], [548, 268], [545, 318], [522, 350], [494, 384], [516, 398], [538, 402], [532, 415], [547, 427], [541, 441], [550, 458], [566, 475], [602, 488], [640, 500], [628, 565], [600, 612], [470, 668], [360, 780]];
function headMask(c) {
  smoothShape(c, HEAD);
  const R = rng(3);
  for (let i = 0; i < 16; i++) { const a = -PI * .95 + i / 15 * PI * .78; c.beginPath(); c.arc(672 + Math.cos(a) * 118 + R() * 10, 290 + Math.sin(a) * 118 + R() * 10, 22 + R() * 16, 0, TAU); c.fill(); }
}
function handMask(c, hx, hy, rot, curl, sc = 1) {
  c.save(); c.translate(hx, hy); c.rotate(rot); c.scale(sc, sc);
  c.strokeStyle = c.fillStyle; c.lineCap = 'round'; c.lineJoin = 'round';
  c.beginPath(); c.moveTo(-58, 20); c.quadraticCurveTo(-72, 260, -86, 520); c.lineTo(96, 520); c.quadraticCurveTo(74, 260, 60, 20); c.closePath(); c.fill();
  c.beginPath(); c.ellipse(0, -14, 68, 84, 0, 0, TAU); c.fill();
  const F = [[-58, 10, -62, [56, 46], 36, -1], [-40, -70, -20, [72, 56], 30, 1], [-10, -86, -5, [80, 62], 30, 1], [22, -80, 9, [72, 54], 28, 1], [48, -62, 24, [54, 42], 24, 1]];
  for (const [bx, by, a0, lens, w, dir] of F) {
    let x = bx, y = by, a = a0 * PI / 180; c.lineWidth = w; c.beginPath(); c.moveTo(x, y);
    lens.forEach((l, j) => { a -= dir * curl * (j ? 1.25 : .55); x += Math.sin(a) * l; y -= Math.cos(a) * l; c.lineTo(x, y); });
    c.stroke();
  }
  c.restore();
}
function thermal(g, maskFn, hx, hy, glowY) {
  const c = TC.getContext('2d'); reset(c); c.clearRect(0, 0, W, H);
  c.fillStyle = '#a3140b'; maskFn(c);
  c.globalCompositeOperation = 'source-atop';
  const layer = (col, s, blur) => { c.filter = `blur(${blur}px)`; c.fillStyle = col; c.save(); c.translate(hx, hy); c.scale(s, s); c.translate(-hx, -hy); maskFn(c); c.restore(); };
  layer('#e8400f', .9, 10); layer('#ff8a1e', .74, 22); layer('#ffbf5a', .52, 30); layer('#fff0c4', .26, 36);
  c.filter = 'none';
  const lg = c.createLinearGradient(0, glowY, 0, H); lg.addColorStop(0, 'rgba(255,236,190,0)'); lg.addColorStop(1, 'rgba(255,246,222,.95)');
  c.fillStyle = lg; c.fillRect(0, 0, W, H);
  g.save(); g.filter = 'blur(22px)'; g.globalAlpha = .35; g.drawImage(TC, 0, 0); g.filter = 'blur(2.5px)'; g.globalAlpha = 1; g.drawImage(TC, 0, 0); g.restore();
}

// ---------- the story ----------
const Q = ['all', 'this', 'time', 'i', 'was', 'finding', 'myself'];
const RING = ['plant', 'backpack', 'guitar', 'compass', 'book', 'camera', 'moon', 'sun', 'clock', 'heart', 'boot', 'mountain'];
function ringPos(i, rot, cx = 480, cy = 370, rx = 300, ry = 215) { const a = i / RING.length * TAU + rot; return [cx + Math.cos(a) * rx, cy + Math.sin(a) * ry, a]; }

// S1 (beats 0-4): big words, then the sentence types out with pen marks
function s1(g, bt) {
  paper(g);
  if (bt < 2) {
    const w = bt < 1 ? 'all this' : 'time', p = eOut(seg(bt % 1, 0, .2));
    g.save(); g.strokeStyle = 'rgba(110,40,25,.8)'; g.lineWidth = 1.6; g.setLineDash([12, 9]); g.lineDashOffset = -bt * 40;
    [262, 392].forEach(y => { g.beginPath(); g.moveTo(0, y); g.lineTo(W, y); g.stroke(); }); g.restore();
    g.globalAlpha = p; g.font = '800 168px Inter'; g.textBaseline = 'alphabetic'; g.fillStyle = '#141212';
    const x = bt < 1 ? 60 : 300; g.save(); g.translate(x + (1 - p) * 30, 392); g.fillText(w, 0, 0); g.restore(); g.globalAlpha = 1;
    if (bt > 1.55) pen(g, [[640, 440], [700, 520], [760, 470], [820, 560], [900, 520]], seg(bt, 1.55, 1.95), INK, 2);
    return;
  }
  const n = Math.ceil(seg(bt, 2, 3.2) * Q.length), boxes = sentence(g, Q, n, 480, 370, 26, INK, 600);
  pen(g, [[600, 60], [585, 160], [560, 250], [530, 320], [500, 400], [470, 520], [520, 620], [600, 650]], seg(bt, 2.05, 2.7), INK, 1.8, seg(bt, 2.55, 3.1));
  const f = boxes[5]; scribble(g, f.cx, 372, f.w * .72, 26, eOut(seg(bt, 3.1, 3.9)), 11, '#3a1610', 2.2, 1.15, -.05);
}
// S2 (4-7): objects + red strokes burst in, cyan flare sweeps, vignette closes in
function s2(g, bt) {
  paper(g);
  const objs = [['book', 640, 210], ['compass', 780, 240], ['clock', 740, 500], ['camera', 880, 560], ['boot', 330, 220], ['sun', 420, 540]];
  objs.forEach(([n, x, y], i) => { const p = eBack(seg(bt, 4.05 + i * .1, 4.5 + i * .1)); if (p > 0) spr(g, n, x + (bt - 4) * 6, y - (bt - 4) * 4, 46 * p, -.3 + i * .15); });
  const R = rng(21);
  for (let i = 0; i < 9; i++) {
