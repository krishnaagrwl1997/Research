/* ---------- helpers ---------- */
const clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,p)=>a+(b-a)*p;
const eOutBack=p=>{const c=1.9;return 1+(c+1)*Math.pow(p-1,3)+c*Math.pow(p-1,2)};
const eOutCubic=p=>1-Math.pow(1-p,3);
const eInCubic=p=>p*p*p;
const eOutBounce=p=>{const n=7.5625,d=2.75;if(p<1/d)return n*p*p;if(p<2/d)return n*(p-=1.5/d)*p+.75;if(p<2.5/d)return n*(p-=2.25/d)*p+.9375;return n*(p-=2.625/d)*p+.984375};
const hash=(n)=>{const x=Math.sin(n*127.1+311.7)*43758.5453;return x-Math.floor(x)};
const beatPos=t=>(t-GRID0)/B;
const beatFrac=t=>{const b=beatPos(t);return b-Math.floor(b)};
const kick=t=>Math.exp(-beatFrac(t)*7);          // 1 on the beat, decays
const P=(v)=>(v/160*100).toFixed(3)+"%";           // x units -> %
const PY=(v)=>(v/90*100).toFixed(3)+"%";           // y units -> %
const lineAt=t=>{for(let i=LINES.length-1;i>=0;i--) if(t>=LINES[i].a) return i; return 0};

/* ---------- confetti ---------- */
const MOTIFS = {

 chilli:'<svg viewBox="0 0 24 24"><path d="M5 6 C9 8 13 14 20 20 C12 19 7 13 5 6Z" fill="#D7263D"/><path d="M5 6 l-2 -3" stroke="#1F9D55" stroke-width="2.4" stroke-linecap="round"/></svg>',
 lemon:'<svg viewBox="0 0 24 24"><ellipse cx="12" cy="12" rx="8" ry="6.5" fill="#F5C82E"/><ellipse cx="9.5" cy="10" rx="3" ry="2" fill="#FBE38A"/></svg>',

 spark:'<svg viewBox="0 0 24 24"><path d="M12 1 Q13 11 23 12 Q13 13 12 23 Q11 13 1 12 Q11 11 12 1Z" fill="#FFF6C9"/></svg>',
 chai:'<svg viewBox="0 0 24 24"><path d="M6 6 h12 l-1.5 15 h-9Z" fill="#fff" fill-opacity=".8"/><path d="M7 10 h10 l-1 10 h-8Z" fill="#C69C72"/></svg>'
};
const KINDS=["marigold","chilli","heart","spark","lemon","chai"];
function confetti(t,n=16,kinds=KINDS){
  let h="", k=kick(t);
  for(let i=0;i<n;i++){
    const x=hash(i)*100+Math.sin(t*.35+i)*3, y=hash(i+40)*100+Math.cos(t*.3+i*1.7)*4;
    const r=hash(i+80)*360+t*(hash(i+9)>.5?40:-40), sz=2.6+hash(i+20)*3.4, s=1+.35*k;
    h+=`<div class="cf" style="left:${x.toFixed(2)}%;top:${y.toFixed(2)}%;width:${sz.toFixed(2)}cqw;transform:rotate(${r.toFixed(1)}deg) scale(${s.toFixed(3)})">${MOTIFS[kinds[i%kinds.length]]}</div>`;
  }
  return `<div class="cfl">${h}</div>`;
}

/* ---------- image cards ---------- */
function cards(L,t,u,dur,next){
  const s=S[L.sc]; if(!s) return "";
  const k=kick(t), boil=`url(#boil${Math.floor(t*12)%6})`;
  return s.im.map((l,j)=>{
    let [r,x,y,w,h,size,pos,extra=""]=l;
    // keep cards inside the frame so they read as collage stickers
    const full = w>=99 && h>=99; const strip = w<=21 && h>=99;
    if(!full && !strip){ const ix=3, iy=5; if(x<ix){w-=ix-x;x=ix} if(y<iy){h-=iy-y;y=iy} if(x+w>100-ix) w=100-ix-x; if(y+h>100-iy) h=100-iy-y; }
    const cx=x+w/2, dir = cx<50?-1:1;
    const tilt = strip||full?0:(hash(L.sc*7+j)-.5)*6;
    // entrance / exit
    const ein = clamp(u/.38), eout = next===L.sc?0:clamp((u-(dur-.18))/.18);
    const enterX = (1-eOutBack(ein))*dir*120*(strip?0:1), enterY = strip?(1-eOutBack(clamp((u-j*B*.5)/.3)))*-110:0;
    const exitX = eInCubic(eout)*dir*130;
    const rot = tilt + (1-ein)*dir*14 + Math.sin(t*1.7+j)*1.2;
    // beat squash and 12 fps hand-made jitter
    const step=Math.floor(t*12), jx=(hash(step+j*31)-.5)*.5, jy=(hash(step+j*57)-.5)*.5;
    const sq = (L.beat?1:.5)*k;
    const sx=1+.035*sq, sy=1-.03*sq;
    // ken burns on the art inside the card
    const kb = L.cam==="pull"?1.15-.15*clamp(u/dur):1+.12*clamp(u/dur);
    const pan = L.cam==="pan"?(clamp(u/dur)-.5)*-6:0;
    let filt=boil;
    if(L.fx==="freeze") filt+=` hue-rotate(${(190*clamp((u-.6)/2.4)).toFixed(0)}deg) saturate(${(1-.25*clamp((u-.6)/2.4)).toFixed(2)})`;
    const flip = L.alt?"scaleX(-1)":"";
    const sizeA = L.alt && size!=="cover" ? (parseFloat(size)*1.25)+"%" : size;
    const sticker = full||strip?"":"sticker";
    return `<div class="card ${sticker}" style="left:${x}%;top:${y}%;width:${w}%;height:${h}%;transform:translate(${(enterX+exitX+jx).toFixed(2)}%,${(enterY+jy).toFixed(2)}%) rotate(${rot.toFixed(2)}deg) scale(${sx.toFixed(3)},${sy.toFixed(3)});filter:${filt}"><div class="art" style="background-image:url(refs/${r}.jpg);background-size:${sizeA};background-position:${pos};transform:${flip} scale(${kb.toFixed(3)}) translateX(${pan.toFixed(2)}%);${extra.replace(/transform:[^;]*;?/,"").replace(/box-shadow:[^;]*;?/,"")}"></div></div>`;
  }).join("");
}
function kaleido(spec,t,speed=1){
  const [ref,size,pos]=spec; let tl="";
  for(let r=0;r<6;r++) for(let c=0;c<6;c++) tl+=`<div class="kt" style="background-image:url(refs/${ref}.jpg);background-size:${size};background-position:${pos};transform:scale(${c%2?-1:1},${r%2?-1:1})"></div>`;
  const rings=[0,1].map(i=>{const p=((beatPos(t)+i*.5)%1+1)%1; return `<div class="kring" style="transform:scale(${(.15+1.8*p).toFixed(3)});opacity:${(1-p).toFixed(3)}"></div>`}).join("");
  return `<div class="kal" style="transform:rotate(${(t*22*speed).toFixed(2)}deg) scale(${(1+.05*kick(t)).toFixed(3)})"><div class="kgrid">${tl}</div></div>${rings}`;
}

/* ---------- lyric text ---------- */
const ZONE={L:{cx:46,w:62,yc:40,base:7.6},R:{cx:114,w:62,yc:40,base:7.6},C:{cx:80,w:118,yc:40,base:9},LR:{base:7.2},T:{cx:80,w:118,yc:16,base:6.2},TB:{cx:80,w:118,base:6.6}};
const W_FACTOR=.5;
function wrap(r,maxChars){ const out=[]; let cur=""; for(const w of r.split(" ")){ const n=cur?cur+" "+w:w; if(n.length>maxChars&&cur){out.push(cur);cur=w}else cur=n } if(cur) out.push(cur); return out }
function rowsOf(txt,maxChars){ return txt.split(/(?<=[,?])\s+/).flatMap(r=>wrap(r,maxChars)) }
const maxCharsFor=(w,base)=>Math.max(6,Math.floor(w/(W_FACTOR*1.6*base*.82)));
function layoutRows(L){
  const z=ZONE[L.zone], rows=rowsOf(L.txt, maxCharsFor(z.w||46, L.base||z.base));
  const out=[];
  if(L.zone==="LR"){
    const all=L.txt.split(" "), cut=L.split||Math.ceil(all.length/2);
    const groups = L.split ? [all.slice(0,cut).join(" "), all.slice(cut).join(" ")] : L.txt.split(/(?<=[,?])\s+/);
    const mc=maxCharsFor(44,z.base);
    groups.forEach((g,i)=>{ const side=i%2, rs=wrap(g,mc), sz=Math.min(z.base,...rs.map(r=>44/(r.length*W_FACTOR*1.6))), rh=sz*1.6*1.25;
      const yc = groups.length>2 ? 22+i*21 : (side?52:30);
      rs.forEach((r,k)=>out.push({r,cx:side?126:34,y:yc+(k-(rs.length-1)/2)*rh,sz})) });
    return out;
  }
  if(L.zone==="TB"){ L.txt.split(/(?<=[,?])\s+/).forEach((r,i)=>{ let sz=Math.min(z.base,z.w/(r.length*W_FACTOR*1.6)); out.push({r,cx:80,y:i?72:13,sz}) }); return out }
  let sz=Math.min(L.base||z.base, ...rows.map(r=>z.w/(r.length*W_FACTOR*1.6)));
  const rh=sz*1.6*1.3, n=rows.length;
  rows.forEach((r,i)=>out.push({r,cx:z.cx,y:z.yc+(i-(n-1)/2)*rh,sz}));
  return out;
}
function wordTimes(L,words){
  const span=(L.b-L.a)*(L.pre==="type"?.6:.72), w=words.map(x=>Math.max(2,x.length)), tot=w.reduce((a,b)=>a+b,0);
  let c=0; return w.map(x=>{const tt=L.a+.02+span*(c/tot); c+=x; return tt});
}
function textLayer(L,t,u,dur){
  const rows=layoutRows(L); const all=[]; rows.forEach((R,ri)=>R.r.split(" ").forEach(w=>all.push({w,ri})));
  const wt=wordTimes(L,all.map(x=>x.w));
  const col=L.col||"#FFF3C4", sh=L.sh===undefined?"#2A0F2E":L.sh, hl=L.hl||(col.toUpperCase()==="#FFF3C4"?"#E3F13A":"#FFFFFF");
  const exitP=clamp((u-(dur-.2))/.2);
  let html="", idx=0, shake=0;
  rows.forEach((R,ri)=>{
    const words=R.r.split(" "), n=words.length, mid=(n-1)/2;
    let inner=words.map((w,k)=>{
      const i=idx++, q=t-wt[i];
      let tf="", op=1, clip="", c=col;
      if(q<0){ op=0 }
      const p=clamp(q/.24);
      switch(L.pre){
        case "slam": tf=`scale(${lerp(2.3,1,eOutBack(clamp(q/.2))).toFixed(3)})`; op=q<0?0:clamp(q/.06); if(q>=0) shake+=Math.exp(-q*14); break;
        case "zoom": tf=`scale(${lerp(3.6,1,eOutCubic(clamp(q/.26))).toFixed(3)})`; op=q<0?0:clamp(q/.12); break;
        case "bounce": tf=`translateY(${((1-eOutBounce(clamp(q/.42)))*-160).toFixed(1)}%)`; op=q<0?0:1; break;
        case "rise": tf=`translateY(${((1-eOutBack(p))*90).toFixed(1)}%) rotate(${((1-p)*(k%2?-12:12)).toFixed(1)}deg)`; op=q<0?0:clamp(q/.1); break;
        case "type": op=q<0?0:1; clip=`clip-path:inset(-30% ${((1-clamp(q/Math.max(.18,(wt[i+1]||L.a+dur*.6)-wt[i])))*100).toFixed(1)}% -30% 0)`; break;
        case "slow": tf=`translateY(${((1-eOutCubic(clamp(q/.8)))*40).toFixed(1)}%)`; op=q<0?0:clamp(q/.6); break;
        case "stack": tf=`scale(${eOutBack(p).toFixed(3)}) rotate(${(k%2?-5:5)}deg)`; op=q<0?0:1; break;
        case "arc": tf=`scale(${eOutBack(p).toFixed(3)})`; op=q<0?0:1; break;
        default: tf=`scale(${eOutBack(p).toFixed(3)})`; op=q<0?0:1;
      }
      // the word being sung right now pops and changes colour
      const act = q>=0 && q<.38 ? 1-q/.38 : 0;
      if(act>0) c=hl;
      const bump = 1+.22*act;
      // continuous flag wave
      const ph=t/(2*B)*Math.PI*2+k*.7;
      const waveAmp = L.pre==="ribbon"?.28:.07, rotAmp=L.pre==="ribbon"?5:3;
      let wave=`translateY(${(Math.sin(ph)*waveAmp).toFixed(3)}em) rotate(${(Math.sin(ph+1)*rotAmp).toFixed(2)}deg)`;
      // arc placement
      const arc = (L.pre==="arc")?`translateY(${(((k-mid)**2)*.06).toFixed(3)}em) rotate(${((k-mid)*7).toFixed(1)}deg)`:"";
      // special word effects
      let fx="";
      if(L.fx==="tip" && ri===rows.length-1 && q>0) fx=`rotate(${(14*clamp((q-.5)/.5)).toFixed(1)}deg) translateY(${(18*clamp((q-.5)/.5)).toFixed(1)}%)`;
      if(L.fx==="forget" && ri===rows.length-1 && q>0) op*=1-.6*clamp((q-.6)/.8);
      if(L.fx==="wobbleLast" && i===all.length-1 && q>0) fx=`rotate(${(Math.sin(q*18)*7*Math.exp(-q*1.2)).toFixed(1)}deg) scale(${(1+Math.sin(q*14)*.06).toFixed(3)})`;
      if(L.pre==="slow" && w.startsWith("स्लो") && q>0) fx=`scaleX(${(1+.45*clamp(q/1.4)).toFixed(3)})`;
      if(L.pre==="drip" && i===all.length-1 && q>.5) fx=`translateY(${(16*clamp((q-.5)/1)).toFixed(1)}%) scaleY(${(1+.25*clamp((q-.5)/1)).toFixed(3)})`;
      if(L.fx==="freeze" && ri===rows.length-1 && q>0) c=act>0?hl:"#BFEAFF";
      // exit: words scatter up and shrink, staggered
      if(exitP>0){ const e=clamp(exitP*1.6-(k/n)*.6); op*=1-e; tf+=` translateY(${(-60*eInCubic(e)).toFixed(1)}%) scale(${(1-.6*e).toFixed(3)})`; }
      const chip = (L.pre==="stack"||L.chip)?" chip":"";
      return `<span class="wa" style="transform:${arc}"><span class="w${chip}" style="opacity:${op.toFixed(3)};transform:${tf} ${fx};${clip}"><span class="wv" style="transform:${wave} scale(${bump.toFixed(3)});color:${c}">${w}</span></span></span>`;
    }).join(" ");
    const shadow = sh?`text-shadow:${(R.sz*.07).toFixed(2)}cqw ${(R.sz*.07).toFixed(2)}cqw 0 ${sh};`:"";
    html+=`<div class="tx f-${L.font||"baloo"}" style="left:${P(R.cx)};top:${PY(R.y)};font-size:${R.sz.toFixed(2)}cqw;${shadow}">${inner}</div>`;
  });
  return {html, shake};
}
function steamPath(L,u){
  const right=L.zone==="R"; const x0=right?30:130, y0=60;
  const d=`M${x0} ${y0} C ${x0+(right?12:-12)} 30, ${right?70:90} 22, ${right?96:64} 30 S ${right?132:28} 46, ${right?152:8} 20`;
  const draw=clamp(u/1.1), flow=(u*30)%20;
  return `<svg class="steam" viewBox="0 0 160 90" preserveAspectRatio="none" aria-hidden="true"><path d="${d}" pathLength="100" class="st1" style="stroke-dashoffset:${(100-100*eOutCubic(draw)).toFixed(2)}"/><path d="${d}" pathLength="100" class="st2" style="stroke-dashoffset:${(-flow).toFixed(2)};opacity:${draw.toFixed(2)}"/></svg>`;
}

/* ---------- scene renderers ---------- */
function bgFor(L,t){
  if(L.snap){ const c=PALS[L.snap]; return c[((Math.floor(beatPos(t))%c.length)+c.length)%c.length] }
  return S[L.sc]?S[L.sc].bg:"#1B0F1F";
}
function lineScene(i,t){
  const L=LINES[i], u=t-L.a, dur=L.b-L.a, s=S[L.sc], next=LINES[i+1]&&LINES[i+1].sc;
  const bg=bgFor(L,t);
  let body = confetti(t,14,["intro","pre"].includes(s.s)?["heart","spark","marigold"]:KINDS);
  body += L.kal ? kaleido(L.kal,t,L.kalSpeed||1) : cards(L,t,u,dur,next);
  body += `<div class="ht ${s.st}"></div>`;
  if(L.steam) body+=steamPath(L,u);
  if(L.sc===22) body+=`<div class="rain" style="background-position:${(-t*40).toFixed(1)}px ${(t*900).toFixed(1)}px"></div>`;
  if(L.sc===19){ const p=clamp((u-.15)/.3); body+=`<div class="chat" style="left:8%;top:9%;transform:scale(${eOutBack(p).toFixed(3)}) rotate(-4deg)">hey 🙂 <span>✓✓</span></div>` }
  if(L.sc===10) body+=`<div class="rec" style="left:53%;top:10%;opacity:${beatFrac(t)<.5?1:0}">REC</div>`;
  const T=textLayer(L,t,u,dur);
  if(L.stamp){ const st=LINES[i].a+dur*.42, q=t-st; if(q>0){ const p=clamp(q/.22); body+=`<div class="stamp" style="left:27%;top:50%;transform:translate(-50%,-50%) rotate(-12deg) scale(${lerp(2.4,1,eOutBack(p)).toFixed(3)});opacity:${clamp(q/.08)}">कैंसल</div>`; T.shake+=Math.exp(-q*12)*1.5 } }
  return {bg, body:body+T.html, shake:T.shake, sub:L.en, u, L};
}
const CROPS=[[1,"cover","50% 50%"],[5,"170%","40% 70%"],[2,"190%","45% 22%"],[3,"170%","55% 38%"],[4,"190%","25% 42%"],[2,"200%","85% 12%"],[3,"300%","95% 8%"],[1,"240%","48% 30%"],[5,"150%","70% 85%"],[4,"190%","75% 42%"],[3,"160%","50% 20%"],[2,"cover","50% 50%"]];
function instScene(i,t){
  const L=LINES[i], u=t-L.a, k=kick(t), bi=Math.floor(beatPos(t));
  let body="", bg="#1B0F1F", sub="", shake=0;
  if(L.kind==="title"){
    const bar=Math.floor(u/(4*B)); const ks=[[1,"240%","48% 30%"],[5,"240%","30% 72%"],[2,"260%","88% 12%"],[3,"300%","95% 8%"]][bar%4];
    body+=kaleido(ks,t,.6)+confetti(t,18);
    const p=clamp((u-.2)/.5), sc=eOutBack(p)*(1+.06*k);
    const w1=clamp((u-.6)/.25), w2=clamp((u-1.1)/.3);
    body+=`<div class="badge" style="transform:translate(-50%,-50%) scale(${sc.toFixed(3)}) rotate(${(Math.sin(t*1.3)*3).toFixed(2)}deg)">
      <div class="b1 f-baloo" style="opacity:${w1};transform:translateY(${((1-eOutBack(w1))*40).toFixed(1)}%)">मेरी तो</div>
      <div class="b2 f-rozha" style="transform:scale(${(eOutBack(w2)*(1+.08*k)).toFixed(3)})">अलग है</div>
      <div class="b3">MERI TOH ALAG HAI</div></div>`;
    if(u>6.6) body+=`<div class="fadeblk" style="opacity:${clamp((u-6.6)/.5)*0}"></div>`;
    sub="";
  } else if(L.kind==="gap"){
    body+=kaleido(L.kal,t,1.4)+confetti(t,10);
  } else if(L.kind==="drop"){
    const c=CROPS[((bi%CROPS.length)+CROPS.length)%CROPS.length];
    const lastBar = u>(L.b-L.a)-4*B;
    if(lastBar) body+=kaleido([1,"220%","48% 35%"],t,2);
    else body+=`<div class="full" style="background-image:url(refs/${c[0]}.jpg);background-size:${c[1]};background-position:${c[2]};transform:scale(${(1+.18*k).toFixed(3)}) rotate(${((bi%2?1:-1)*2*k).toFixed(2)}deg);filter:url(#boil${Math.floor(t*12)%6})"></div>`;
    body+=confetti(t,12,["chilli","lemon","spark"]);
    body+=`<div class="flashov" style="opacity:${(beatFrac(t)<.12 && bi%4===0?.7*(1-beatFrac(t)/.12):0).toFixed(3)}"></div>`;
    shake=k*.6;
  } else if(L.kind==="end"){
    bg=PALS.ch[((bi%4)+4)%4];
    const tiles=S[23].im;
    body+=confetti(t,18);
    tiles.forEach((l,j)=>{ const [r,x,y,w,h,size,pos]=l; const q=u-j*B; if(q<0) return; const p=clamp(q/.3);
      body+=`<div class="card sticker" style="left:${x}%;top:${y}%;width:${w}%;height:${h}%;transform:scale(${lerp(1.6,1,eOutBack(p)).toFixed(3)}) rotate(${((hash(j)-.5)*14+Math.sin(t*1.5+j)*2).toFixed(2)}deg);opacity:${clamp(q/.1)};filter:url(#boil${Math.floor(t*12)%6})"><div class="art" style="background-image:url(refs/${r}.jpg);background-size:${size};background-position:${pos}"></div></div>` });
    const tb=u-4.2; if(tb>0){ const p=clamp(tb/.5); body+=`<div class="badge" style="transform:translate(-50%,-50%) scale(${(eOutBack(p)*(1+.05*k)).toFixed(3)})"><div class="b1 f-baloo">मेरी तो</div><div class="b2 f-rozha">अलग है</div><div class="b3 f-kalam" style="opacity:${clamp((tb-1)/.6)}">कल मिलते हैं।</div></div>` }
    body+=`<div class="fadeblk" style="opacity:${clamp((t-(END-1.4))/1.2).toFixed(3)}"></div>`;
  }
  return {bg, body, shake, sub, u, L};
}

/* ---------- transitions + camera ---------- */
function frameFor(i,t){ return LINES[i].kind? instScene(i,t) : lineScene(i,t) }
function render(t){
  t=clamp(t,0,END-.001);
  const i=lineAt(t), L=LINES[i], u=t-L.a;
  const F=frameFor(i,t);
  // camera
  let sc=1, tx=0, ty=0, rot=0;
  if(L.cam==="push") sc=1+.05*clamp(u/(L.b-L.a));
  if(L.cam==="tilt") ty=-2*clamp(u/(L.b-L.a));
  if(L.beat||L.kind) sc+=.035*kick(t);
  const sh=Math.min(2.2,F.shake||0), fr=Math.floor(t*24);
  tx+=(hash(fr)-.5)*1.6*sh; ty+=(hash(fr+7)-.5)*1.6*sh; rot+=(hash(fr+13)-.5)*1.2*sh;
  // transition in
  let over="", clip="";
  const tr=L.tr, q=u;
  if(tr==="zoom" && q<.28) sc*=lerp(1.3,1,eOutCubic(q/.28));
  if(tr==="slide" && q<.3) tx+=(1-eOutCubic(q/.3))*100;
  if(tr==="flash" && q<.22) over+=`<div class="flashov" style="opacity:${(1-q/.22).toFixed(3)}"></div>`;
  if(tr==="iris" && q<.4) clip=`clip-path:circle(${(eOutCubic(q/.4)*80).toFixed(1)}% at 50% 50%)`;
  // colour wipe that straddles the cut (starts in the previous line)
  const nx=LINES[i+1]; let wipe="";
  const wipeOf=(Lw,qq)=>{ const p=clamp((qq+.15)/.3); if(p<=0||p>=1) return ""; const c=(Lw.kind?"#F5C82E":bgFor(Lw,t)); return `<div class="wipe" style="background:${c};transform:translateX(${(-100+200*p).toFixed(1)}%) skewX(-12deg)"></div>` };
  if(tr==="wipe" && q<.15) wipe=wipeOf(L,q);
  if(nx && nx.tr==="wipe" && t>nx.a-.15) wipe=wipeOf(nx,t-nx.a);
  let prevBg="";
  if(tr==="iris" && q<.4 && i>0){ const Fp=frameFor(i-1,t); prevBg=`<div class="layer0" style="background:${Fp.bg}">${Fp.body}</div>` }
  const subP=clamp(u/.25), subOut=clamp((u-(L.b-L.a-.15))/.15);
  const sub=F.sub?`<div class="sub" style="opacity:${(subP*(1-subOut)).toFixed(3)};transform:translate(-50%,${((1-eOutCubic(subP))*60).toFixed(0)}%)">${F.sub}</div>`:"";
  stage.innerHTML = prevBg+`<div class="layer0" style="background:${F.bg};${clip}"><div class="cam" style="transform:translate(${tx.toFixed(2)}%,${ty.toFixed(2)}%) rotate(${rot.toFixed(2)}deg) scale(${sc.toFixed(4)})">${F.body}</div>${over}</div>${wipe}${sub}`;
}
window.__renderAt=render;

const stage=document.getElementById("stage"), audio=document.getElementById("song"), btn=document.getElementById("play"), seek=document.getElementById("seek"), tl=document.getElementById("time");
let playing=false, useAudio=true, t0=0, pausedAt=0;
audio.addEventListener("error",()=>{useAudio=false});
const now=()=>useAudio?audio.currentTime:(playing?(performance.now()-t0)/1000:pausedAt);
function loop(){ const t=now(); render(t); seek.value=t; tl.textContent=`${Math.floor(t/60)}:${String(Math.floor(t%60)).padStart(2,"0")}`; if(t>=END-.05){playing=false;btn.textContent="▶ Play"} if(playing) requestAnimationFrame(loop) }
btn.addEventListener("click",()=>{ if(playing){ playing=false; pausedAt=now(); if(useAudio) audio.pause(); btn.textContent="▶ Play" } else { playing=true; btn.textContent="❚❚ Pause"; if(useAudio) audio.play().catch(()=>{useAudio=false; t0=performance.now()-pausedAt*1000}); else t0=performance.now()-pausedAt*1000; requestAnimationFrame(loop) } });
seek.addEventListener("input",()=>{ const t=+seek.value; pausedAt=t; t0=performance.now()-t*1000; if(useAudio) audio.currentTime=t; render(t) });
document.fonts.ready.then(()=>render(14.5));
</script>
