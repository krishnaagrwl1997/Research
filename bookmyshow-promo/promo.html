<!doctype html>
<html><head><meta charset="utf-8"><title>Kernel's Friday Night</title>
<style>html,body{margin:0;background:#111}canvas{display:block;width:100vw;height:auto}</style>
<script src="audio/voice.js"></script>
</head><body><canvas id="c"></canvas>
<script>
// "Kernel's Friday Night": spec/concept promo for BookMyShow, narrated by an original mascot (Kernel, a popcorn bucket).
// Every frame is a pure function of time; render.mjs exports the scene/sfx timeline for audio/mix.py.
const W = 1280, H = 720, S = 1.5, FPS = 30, TR = 0.45;
const cv = document.getElementById('c'); cv.width = W * S; cv.height = H * S;
const ctx = cv.getContext('2d');
function mk(w = W * S, h = H * S) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }
const offA = mk(), offB = mk();

const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const seg = (t, a, d) => clamp((t - a) / d);
const eOut = x => 1 - Math.pow(1 - x, 3);
const eIO = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const eBack = x => { const c1 = 1.9, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
const lerp = (a, b, p) => a + (b - a) * p;
const bump = (t, a, d) => Math.sin(seg(t, a, d) * Math.PI);

const C = {
  ink: '#141414', paper: '#FFFDF8', cream: '#F4EFE6', red: '#E23744', deep: '#9C1D2B',
  yellow: '#F6E94B', salmon: '#FFB199', peri: '#A9B4FF', mint: '#8FE3B9', sky: '#7CC4FF',
  lav: '#C9B6FF', dark: '#121110', green: '#1FA35B', grey: '#CFCBC4'
};
const SANS = 'Inter', MONO = '"DejaVu Sans Mono"';
let GT = 0;

function mulberry(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function rr(c, x, y, w, h, r) { c.beginPath(); c.roundRect(x, y, w, h, r); }
function card(c, x, y, w, h, fill = '#fff', r = 14, sh = 6) {
  rr(c, x + sh, y + sh, w, h, r); c.fillStyle = C.ink; c.fill();
  rr(c, x, y, w, h, r); c.fillStyle = fill; c.fill(); c.lineWidth = 3; c.strokeStyle = C.ink; c.stroke();
}
function pop(c, cx, cy, p, fn, rot = 0) {
  if (p <= 0) return;
  c.save(); c.translate(cx, cy); c.rotate(rot); const s = eBack(clamp(p)); c.scale(s, s);
  c.globalAlpha *= clamp(p * 3); c.translate(-cx, -cy); fn(); c.restore();
}
function font(c, w, s, f = SANS) { c.font = `${w} ${s}px ${f}`; }
function txt(c, s, x, y, { w = 600, size = 16, f = SANS, col = C.ink, al = 'left', ls = '0px' } = {}) {
  font(c, w, size, f); c.fillStyle = col; c.textAlign = al; c.letterSpacing = ls; c.fillText(s, x, y); c.letterSpacing = '0px';
}
function pill(c, x, y, w, h, fill, stroke = C.ink) { rr(c, x, y, w, h, h / 2); c.fillStyle = fill; c.fill(); if (stroke) { c.lineWidth = 2.5; c.strokeStyle = stroke; c.stroke(); } }
function check(c, x, y, s, col = '#fff', lw = 3) { c.beginPath(); c.moveTo(x - s * .5, y); c.lineTo(x - s * .1, y + s * .4); c.lineTo(x + s * .55, y - s * .4); c.strokeStyle = col; c.lineWidth = lw; c.lineCap = 'round'; c.lineJoin = 'round'; c.stroke(); }
function starPath(c, x, y, R, r) {
  c.beginPath();
  for (let i = 0; i < 10; i++) { const a = -Math.PI / 2 + i * Math.PI / 5, rad = i % 2 ? r : R; c.lineTo(x + Math.cos(a) * rad, y + Math.sin(a) * rad); }
  c.closePath();
}
function headline(c, lines, x, y, size, t, t0, col = C.ink, al = 'left') {
  font(c, 800, size); c.letterSpacing = '-2px';
  let k = 0;
  lines.forEach((line, li) => {
    const toks = line.map(tok => typeof tok === 'string' ? { t: tok } : tok);
    const ws = toks.map(o => c.measureText(o.t).width), gap = size * 0.27;
    const total = ws.reduce((a, b) => a + b, 0) + gap * (toks.length - 1);
    let cx = al === 'center' ? x - total / 2 : x; const ly = y + li * size * 1.08;
    toks.forEach((o, j) => {
      const d = (o.at ?? t0 + k * 0.07); k++;
      const p = eOut(seg(t, d, 0.4));
      if (p > 0) {
        if (o.hl) { const hp = eOut(seg(t, d + 0.18, 0.3)); c.fillStyle = o.hl; c.fillRect(cx - 7, ly - size * .84, (ws[j] + 14) * hp, size * 1.06); }
        c.save(); c.globalAlpha *= p; c.fillStyle = o.tc || col; c.textAlign = 'left';
        c.fillText(o.t, cx, ly + (1 - p) * 26); c.restore();
      }
      cx += ws[j] + gap;
    });
  });
  c.letterSpacing = '0px';
}

// ---------- dithering ----------
const PAL = ['#141414', '#FFF6EC', '#E23744', '#9C1D2B', '#FFE7A8', '#E9B949', '#F6E94B', '#F2A3A8', '#8A8580', '#5A1220', '#8CCBF2', '#C77B2E']
  .map(h => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)]);
const BAYER = [[0, 8, 2, 10], [12, 4, 14, 6], [3, 11, 1, 9], [15, 7, 13, 5]];
function dither(src, dst, spread = 60) {
  const sc = src.getContext('2d', { willReadFrequently: true });
  const im = sc.getImageData(0, 0, src.width, src.height), d = im.data;
  for (let y = 0; y < src.height; y++) for (let x = 0; x < src.width; x++) {
    const i = (y * src.width + x) * 4;
    if (d[i + 3] < 110) { d[i + 3] = 0; continue; }
    const th = (BAYER[y & 3][x & 3] / 16 - 0.47) * spread;
    const r = d[i] + th, g = d[i + 1] + th, b = d[i + 2] + th;
    let best = 0, bd = 1e9;
    for (let p = 0; p < PAL.length; p++) {
      const q = PAL[p], dd = (r - q[0]) ** 2 * .3 + (g - q[1]) ** 2 * .59 + (b - q[2]) ** 2 * .11;
      if (dd < bd) { bd = dd; best = p; }
    }
    d[i] = PAL[best][0]; d[i + 1] = PAL[best][1]; d[i + 2] = PAL[best][2]; d[i + 3] = 255;
  }
  dst.getContext('2d').putImageData(im, 0, 0);
}
function sprite(w, h, fn, spread = 70) { const lo = mk(w, h), out = mk(w, h); fn(lo.getContext('2d')); dither(lo, out, spread); return out; }
function blit(c, img, x, y, sc, rot = 0) {
  c.save(); c.translate(x, y); c.rotate(rot); c.imageSmoothingEnabled = false;
  c.drawImage(img, -img.width * sc / 2, -img.height * sc / 2, img.width * sc, img.height * sc); c.restore(); c.imageSmoothingEnabled = true;
}

// ---------- Kernel ----------
const LW = 260, LH = 252, OX = 30, OY = 12;   // low-res canvas; bucket base sits at (130, 240)
const mLow = mk(LW, LH), mOut = mk(LW, LH);
const KERNELS = [[52, 70, 20], [80, 52, 22], [112, 46, 22], [142, 60, 21], [158, 82, 16], [40, 88, 15], [96, 72, 20], [128, 80, 18], [66, 86, 16], [100, 30, 15]];
function kernelBlob(c, x, y, r) {
  const g = c.createRadialGradient(x - r * .35, y - r * .4, r * .1, x, y, r);
  g.addColorStop(0, '#FFFDF2'); g.addColorStop(.55, '#FFE7A8'); g.addColorStop(1, '#E9B949');
  c.beginPath(); c.arc(x, y, r, 0, 7); c.fillStyle = g; c.fill(); c.lineWidth = 2.5; c.strokeStyle = C.ink; c.stroke();
}
function mascot(o = {}) {
  const { blink = 0, lx = 0, ly = 0, mouth = 'smile', talk = 0, arms = null, armT = 0, shock = 0, squash = 0, shades = 0, sweat = 0, hide = -1, happy = 0 } = o;
  const c = mLow.getContext('2d', { willReadFrequently: true });
  c.clearRect(0, 0, LW, LH);
  c.save(); c.translate(OX, OY);
  c.translate(100, 228); c.scale(1 + squash * .07, 1 - squash * .07); c.translate(-100, -228);
  c.lineJoin = 'round'; c.lineCap = 'round';
  // ticket stub
  c.save(); c.translate(150, 46); c.rotate(0.38);
  c.beginPath(); c.roundRect(-17, -36, 34, 62, 4); c.fillStyle = '#F6E94B'; c.fill(); c.lineWidth = 3; c.strokeStyle = C.ink; c.stroke();
  c.setLineDash([3, 3]); c.beginPath(); c.moveTo(-12, 8); c.lineTo(12, 8); c.lineWidth = 2; c.stroke(); c.setLineDash([]);
  starPath(c, 0, -14, 9, 4); c.fillStyle = C.red; c.fill();
  c.restore();
  KERNELS.forEach(([x, y, r], i) => { if (i !== hide) kernelBlob(c, x, y, r); });
  // bucket
  const tl = 26, tr = 174, bl = 50, br = 150, ty = 96, by = 228;
  c.save();
  c.beginPath(); c.moveTo(tl, ty); c.lineTo(tr, ty); c.lineTo(br, by); c.lineTo(bl, by); c.closePath(); c.clip();
  for (let i = 0; i < 7; i++) {
    c.beginPath();
    c.moveTo(lerp(tl, tr, i / 7), ty); c.lineTo(lerp(tl, tr, (i + 1) / 7), ty);
    c.lineTo(lerp(bl, br, (i + 1) / 7), by); c.lineTo(lerp(bl, br, i / 7), by); c.closePath();
    c.fillStyle = i % 2 ? '#FFF6EC' : C.red; c.fill();
  }
  const sg = c.createLinearGradient(tl, 0, tr, 0);
  sg.addColorStop(0, 'rgba(60,0,10,.55)'); sg.addColorStop(.3, 'rgba(0,0,0,0)'); sg.addColorStop(.72, 'rgba(0,0,0,0)'); sg.addColorStop(1, 'rgba(60,0,10,.6)');
  c.fillStyle = sg; c.fillRect(-OX, -OY, LW, LH);
  c.restore();
  c.beginPath(); c.moveTo(tl, ty); c.lineTo(tr, ty); c.lineTo(br, by); c.lineTo(bl, by); c.closePath(); c.lineWidth = 3; c.strokeStyle = C.ink; c.stroke();
  const rg = c.createLinearGradient(0, 86, 0, 104); rg.addColorStop(0, '#E23744'); rg.addColorStop(1, '#9C1D2B');
  c.beginPath(); c.roundRect(20, 86, 160, 18, 7); c.fillStyle = rg; c.fill(); c.lineWidth = 3; c.stroke();
  // face
  const fg = c.createRadialGradient(92, 140, 6, 100, 156, 54); fg.addColorStop(0, '#FFFFFF'); fg.addColorStop(.7, '#FFF6EC'); fg.addColorStop(1, '#E8D9C4');
  c.beginPath(); c.ellipse(100, 160, 48, 42, 0, 0, 7); c.fillStyle = fg; c.fill(); c.lineWidth = 3; c.stroke();
  c.fillStyle = 'rgba(242,120,130,.75)';
  c.beginPath(); c.ellipse(68, 174, 9, 6, 0, 0, 7); c.fill(); c.beginPath(); c.ellipse(132, 174, 9, 6, 0, 0, 7); c.fill();
  const ey = 152, eh = 12 + shock * 4;
  for (const ex of [82, 118]) {
    if (blink > .5 || happy > .5) {
      c.beginPath();
      if (happy > .5) c.arc(ex, ey + 6, 8, Math.PI * 1.1, Math.PI * 1.9, false); else { c.moveTo(ex - 8, ey + 2); c.quadraticCurveTo(ex, ey + 7, ex + 8, ey + 2); }
      c.lineWidth = 3.5; c.strokeStyle = C.ink; c.stroke();
    } else {
      c.beginPath(); c.ellipse(ex + lx * 2.5, ey + ly * 2.5, 9 + shock * 2, eh, 0, 0, 7); c.fillStyle = C.ink; c.fill();
      c.beginPath(); c.arc(ex + lx * 2.5 + 3, ey + ly * 2.5 - 5, 3.4, 0, 7); c.fillStyle = '#fff'; c.fill();
    }
  }
  const bu = shock * 7;
  c.lineWidth = 3.5; c.strokeStyle = C.ink;
  c.beginPath(); c.moveTo(72, 134 - bu); c.quadraticCurveTo(82, 129 - bu, 92, 133 - bu); c.stroke();
  c.beginPath(); c.moveTo(108, 133 - bu); c.quadraticCurveTo(118, 129 - bu, 128, 134 - bu); c.stroke();
  if (shades > 0) {
    c.save(); c.translate(0, (1 - eOut(shades)) * -70);
    c.fillStyle = C.ink;
    c.beginPath(); c.roundRect(64, 140, 32, 22, [4, 4, 12, 12]); c.fill();
    c.beginPath(); c.roundRect(104, 140, 32, 22, [4, 4, 12, 12]); c.fill();
    c.fillRect(94, 143, 12, 4); c.fillRect(54, 142, 12, 3); c.fillRect(134, 142, 12, 3);
    c.fillStyle = '#fff'; c.fillRect(70, 145, 8, 3); c.fillRect(110, 145, 8, 3);
    c.restore();
  }
  // mouth
  c.lineWidth = 3.5; c.strokeStyle = C.ink;
  if (talk > 0.08) {
    const h = 3 + talk * 12, w = 8 + talk * 5;
    c.save(); c.beginPath(); c.ellipse(100, 179, w, h, 0, 0, 7); c.fillStyle = C.ink; c.fill(); c.clip();
    c.beginPath(); c.ellipse(100, 179 + h * .75, w * .7, h * .55, 0, 0, 7); c.fillStyle = C.red; c.fill(); c.restore();
  } else if (mouth === 'o') { c.beginPath(); c.ellipse(100, 181, 5 + shock * 2, 6 + shock * 3, 0, 0, 7); c.fillStyle = C.ink; c.fill(); }
  else if (mouth === 'grin') {
    c.beginPath(); c.moveTo(88, 174); c.quadraticCurveTo(100, 194, 112, 174); c.closePath(); c.fillStyle = C.ink; c.fill();
    c.beginPath(); c.ellipse(100, 184, 5, 3, 0, 0, 7); c.fillStyle = C.red; c.fill();
  } else if (mouth === 'wobbly') {
    c.beginPath(); c.moveTo(88, 180); for (let i = 1; i <= 6; i++) c.lineTo(88 + i * 4, 180 + (i % 2 ? -3 : 3)); c.stroke();
  } else { c.beginPath(); c.arc(100, 172, 9, Math.PI * .15, Math.PI * .85); c.stroke(); }
  if (sweat > 0) {
    const sy = 120 + (armT * 40 % 30);
    c.save(); c.globalAlpha = sweat; c.beginPath(); c.moveTo(150, sy - 12); c.quadraticCurveTo(158, sy, 150, sy + 6); c.quadraticCurveTo(142, sy, 150, sy - 12);
    c.fillStyle = '#8CCBF2'; c.fill(); c.lineWidth = 2.5; c.stroke(); c.restore();
  }
  // arms
  const glove = (x, y, r = 11) => { c.beginPath(); c.arc(x, y, r, 0, 7); c.fillStyle = '#fff'; c.fill(); c.lineWidth = 3; c.strokeStyle = C.ink; c.stroke(); };
  const arm = (x1, y1, cx, cy, x2, y2) => { c.beginPath(); c.moveTo(x1, y1); c.quadraticCurveTo(cx, cy, x2, y2); c.lineWidth = 4; c.strokeStyle = C.ink; c.stroke(); };
  const sw = Math.sin(armT * Math.PI * 2);
  if (arms === 'psst') { arm(150, 168, 150, 196, 124, 184); glove(120, 181); }
  if (arms === 'wave') { const a = sw * .35; c.save(); c.translate(160, 160); c.rotate(-0.9 + a); arm(0, 0, 17, 0, 34, 0); glove(38, 0); c.restore(); }
  if (arms === 'point') { arm(160, 168, 178, 196, 188, 200); glove(190, 200, 15); c.beginPath(); c.roundRect(176, 184, 9, 18, 4); c.fillStyle = '#fff'; c.fill(); c.lineWidth = 2.5; c.stroke(); }
  if (arms === 'up') { const j = sw * 4; arm(40, 162, 20, 140, 12, 104 + j); glove(12, 100 + j); arm(160, 162, 180, 140, 188, 104 - j); glove(188, 100 - j); }
  if (arms === 'hold') { const tt = sw * 8; arm(40, 168, 14, 160, -12, 150 + tt); glove(-16, 150 + tt); arm(160, 168, 186, 160, 212, 150 - tt); glove(216, 150 - tt); }
  if (arms === 'walk') { arm(40, 168, 30, 186, 28 + sw * 8, 206); glove(28 + sw * 8, 208, 10); arm(160, 168, 170, 186, 172 - sw * 8, 206); glove(172 - sw * 8, 208, 10); }
  if (arms === 'kiss') { arm(160, 168, 150, 196, 116, 182); glove(112, 180); }
  if (arms === 'flourish') { c.save(); c.translate(160, 160); c.rotate(-0.5); arm(0, 0, 20, -4, 40, 0); glove(44, 0, 13); c.restore(); }
  if (arms === 'bow') { arm(40, 168, 30, 200, 60, 214); glove(62, 214, 10); arm(160, 168, 196, 150, 214, 120); glove(216, 116); }
  c.restore();
  dither(mLow, mOut);
  return mOut;
}
// draw Kernel with its bucket base at (x, y)
function K(c, x, y, sc, o = {}, rot = 0) {
  const m = mascot(o);
  c.save(); c.translate(x, y); c.rotate(rot); c.imageSmoothingEnabled = false;
  c.drawImage(m, -130 * sc, -240 * sc, LW * sc, LH * sc); c.imageSmoothingEnabled = true; c.restore();
}
const kernelSprite = sprite(36, 36, c => kernelBlob(c, 18, 18, 15));
const tokSprite = sprite(44, 30, c => {
  const g = c.createLinearGradient(0, 0, 44, 30); g.addColorStop(0, '#FFE7A8'); g.addColorStop(.5, '#E9B949'); g.addColorStop(1, '#9C1D2B');
  c.beginPath(); c.roundRect(3, 3, 38, 24, 4); c.fillStyle = g; c.fill();
  c.globalCompositeOperation = 'destination-out'; c.beginPath(); c.arc(3, 15, 5, 0, 7); c.arc(41, 15, 5, 0, 7); c.fill();
  c.globalCompositeOperation = 'source-over'; starPath(c, 22, 15, 7, 3); c.fillStyle = '#E23744'; c.fill();
}, 90);
const samosaSprite = sprite(70, 60, c => {
  const g = c.createLinearGradient(10, 10, 60, 55); g.addColorStop(0, '#FFE7A8'); g.addColorStop(.5, '#E9B949'); g.addColorStop(1, '#C77B2E');
  c.beginPath(); c.moveTo(35, 6); c.quadraticCurveTo(40, 6, 64, 50); c.quadraticCurveTo(66, 56, 58, 56); c.lineTo(12, 56); c.quadraticCurveTo(4, 56, 6, 50); c.quadraticCurveTo(30, 6, 35, 6);
  c.fillStyle = g; c.fill(); c.lineWidth = 3; c.strokeStyle = C.ink; c.stroke();
  c.beginPath(); c.moveTo(35, 12); c.lineTo(35, 52); c.lineWidth = 2; c.strokeStyle = 'rgba(120,60,20,.6)'; c.stroke();
}, 80);
function tokens(c, t, seed, n = 8) {
  const R = mulberry(seed);
  for (let i = 0; i < n; i++) {
    const x = R() * W, y = R() * H, sp = 6 + R() * 10, ph = R() * 6, sc = 1.6 + R() * 1.4;
    const px = x + Math.sin(t * .6 + ph) * 18, py = (y - t * sp + H) % H;
    if (Math.abs(px - W / 2) < 300 && py > 100 && py < 620) continue;
    c.save(); c.translate(px, py); c.rotate(Math.sin(t * .9 + ph) * .8); c.scale(Math.cos(t * 1.4 + ph) * sc, sc);
    c.imageSmoothingEnabled = false; c.drawImage(tokSprite, -22, -15); c.restore();
  }
  c.imageSmoothingEnabled = true;
}
function sparkles(c, x, y, t, t0, n = 10, R0 = 30, R1 = 140, col = C.yellow) {
  const p = seg(t, t0, 0.8); if (p <= 0 || p >= 1) return;
  const rnd = mulberry(Math.floor(t0 * 100));
  for (let i = 0; i < n; i++) {
    const a = rnd() * Math.PI * 2, r = lerp(R0, R1 * (0.6 + rnd() * .5), eOut(p)), s = (1 - p) * (8 + rnd() * 8);
    starPath(c, x + Math.cos(a) * r, y + Math.sin(a) * r, s, s * .45); c.fillStyle = col; c.fill(); c.lineWidth = 2; c.strokeStyle = C.ink; c.stroke();
  }
}

// ---------- shared UI ----------
function chrome(c, s) {
  const col = s.dark ? 'rgba(255,255,255,.5)' : 'rgba(20,20,20,.55)';
  txt(c, s.label, 40, 46, { w: 400, size: 13, f: MONO, col });
  const f = Math.floor(GT * FPS), ss = Math.floor(f / FPS), ff = f % FPS;
  txt(c, `BMS · SPEC   00:00:${String(ss).padStart(2, '0')}:${String(ff).padStart(2, '0')}`, 1240, 46, { w: 400, size: 13, f: MONO, col, al: 'right' });
}
function grain(c, dark) {
  const R = mulberry(Math.floor(GT * FPS) * 7919 + 1);
  c.fillStyle = dark ? 'rgba(255,255,255,.07)' : 'rgba(20,20,20,.06)';
  for (let i = 0; i < 260; i++) c.fillRect(R() * W, R() * H, 1 + R() * 1.6, 1 + R() * 1.6);
}
function phone(c, x, y, w, h, dark = false) {
  rr(c, x + 6, y + 6, w, h, 34); c.fillStyle = C.ink; c.fill();
  rr(c, x, y, w, h, 34); c.fillStyle = C.ink; c.fill();
  rr(c, x + 9, y + 9, w - 18, h - 18, 26); c.fillStyle = dark ? '#1E1E1E' : C.paper; c.fill();
  pill(c, x + w / 2 - 40, y + 20, 80, 20, C.ink, null);
  txt(c, '7:24', x + 34, y + 36, { w: 600, size: 12, col: dark ? '#fff' : C.ink });
  return { x: x + 9, y: y + 9, w: w - 18, h: h - 18 };
}
function qr(c, x, y, size, seed, fg = C.ink) {
  const N = 23, m = size / N, R = mulberry(seed);
  c.fillStyle = '#fff'; c.fillRect(x - m, y - m, size + 2 * m, size + 2 * m);
  c.fillStyle = fg;
  const finder = (i, j) => (i < 7 && j < 7) || (i >= N - 7 && j < 7) || (i < 7 && j >= N - 7);
  for (let j = 0; j < N; j++) for (let i = 0; i < N; i++) { const r = R(); if (!finder(i, j) && r < .48) c.fillRect(x + i * m, y + j * m, m + .3, m + .3); }
  for (const [i, j] of [[0, 0], [N - 7, 0], [0, N - 7]]) {
    c.fillRect(x + i * m, y + j * m, 7 * m, 7 * m); c.fillStyle = '#fff'; c.fillRect(x + (i + 1) * m, y + (j + 1) * m, 5 * m, 5 * m);
    c.fillStyle = fg; c.fillRect(x + (i + 2) * m, y + (j + 2) * m, 3 * m, 3 * m);
  }
}
function avatar(c, x, y, r, letter, col) {
  c.beginPath(); c.arc(x, y, r, 0, 7); c.fillStyle = col; c.fill(); c.lineWidth = 2.5; c.strokeStyle = C.ink; c.stroke();

// timeline
let acc = 0;
for (const s of scenes) {
  s.v = voiceFor(s.id, s.lead, s.hot || []);
  s.dur = s.lead + s.v.dur + s.tail; s.start = acc; acc += s.dur;
}
const DURATION = acc;
function drawScene(canvas, s, lt) {
  const c = canvas.getContext('2d');
  c.setTransform(S, 0, 0, S, 0, 0); c.filter = 'none'; c.globalAlpha = 1;
  c.fillStyle = s.bg; c.fillRect(0, 0, W, H);
  s.draw(c, lt, s.v);
  if (!s.noCaps) captions(c, s.v, lt);
  chrome(c, s);
  grain(c, s.dark);
}
function render(t) {
  GT = t;
  let i = scenes.findIndex(s => t < s.start + s.dur); if (i < 0) i = scenes.length - 1;
  const s = scenes[i], lt = t - s.start;
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.filter = 'none'; ctx.clearRect(0, 0, cv.width, cv.height);
  if (i > 0 && lt < TR) {
    const u = lt / TR, p = eIO(u);
    drawScene(offA, scenes[i - 1], scenes[i - 1].dur);
    drawScene(offB, s, lt);
    ctx.filter = `blur(${(Math.sin(Math.PI * u) * 14).toFixed(2)}px)`;
    ctx.drawImage(offA, -p * W * S, 0); ctx.drawImage(offB, (1 - p) * W * S, 0);
    ctx.filter = 'none';
  } else { drawScene(offB, s, lt); ctx.drawImage(offB, 0, 0); }
}
window.DURATION = DURATION; window.FPS = FPS;
window.renderFrame = (t, q = 0.93) => { render(t); return cv.toDataURL('image/jpeg', q); };
window.timeline = () => {
  const sfx = [], music = [];
  scenes.forEach((s, i) => {
    if (i > 0) sfx.push([s.start - 0.05, 'whoosh']);
    for (const [at, name] of (s.sfx ? s.sfx(s.v) : [])) sfx.push([s.start + at, name]);
  });
  const sc = Object.fromEntries(scenes.map(s => [s.id, s]));
  music.push([0, 'off'], [sc.hook.start + 1.5, 'light'], [sc.world.start, 'trailer'], [sc.squad.start, 'full'],
    [sc.snack.start + sc.snack.v.w('wait') - 0.05, 'off'], [sc.gate.start, 'full'], [sc.end.start + sc.end.v.w('bookmyshow'), 'outro']);
  return { duration: DURATION, fps: FPS, voice: scenes.map(s => ({ id: s.id, at: s.start + s.lead })), sfx, music };
};
window.ready = document.fonts.load('800 20px Inter').then(() => document.fonts.load('400 13px "DejaVu Sans Mono"')).then(() => true);
if (!new URLSearchParams(location.search).has('render')) {
  const t0 = performance.now();
  (function loop() { render(((performance.now() - t0) / 1000) % DURATION); requestAnimationFrame(loop); })();
}
